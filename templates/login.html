<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusRide – Login</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080c14;
    --surface: #0f1724;
    --card: #141d2e;
    --border: rgba(99,179,255,0.15);
    --accent: #3b82f6;
    --accent2: #06b6d4;
    --green: #10b981;
    --text: #e2e8f0;
    --muted: #64748b;
    --danger: #ef4444;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Space Grotesk', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    overflow: hidden;
  }

  
  .bg-grid {
    position: fixed; inset: 0; z-index: 0;
    background-image:
      linear-gradient(rgba(59,130,246,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(59,130,246,0.06) 1px, transparent 1px);
    background-size: 50px 50px;
    animation: gridMove 20s linear infinite;
  }
  @keyframes gridMove {
    0% { background-position: 0 0; }
    100% { background-position: 50px 50px; }
  }

  
  .blob { position: fixed; border-radius: 50%; filter: blur(80px); z-index: 0; opacity: 0.25; }
  .blob-1 { width: 500px; height: 500px; background: #1d4ed8; top: -150px; left: -150px; animation: pulse 8s ease-in-out infinite; }
  .blob-2 { width: 400px; height: 400px; background: #0891b2; bottom: -100px; right: -100px; animation: pulse 10s ease-in-out infinite reverse; }
  @keyframes pulse { 0%,100%{transform:scale(1);opacity:0.25} 50%{transform:scale(1.1);opacity:0.35} }

  
  .left-panel {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 60px; position: relative; z-index: 1;
  }
  .right-panel {
    width: 500px; background: var(--card);
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 60px 50px; position: relative; z-index: 1;
    backdrop-filter: blur(10px);
  }

  
  .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 48px; }
  .logo-icon {
    width: 52px; height: 52px; background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 14px; display: flex; align-items: center; justify-content: center;
    font-size: 24px; box-shadow: 0 0 30px rgba(59,130,246,0.4);
  }
  .logo-text { font-family: 'Orbitron', monospace; font-size: 22px; font-weight: 800; letter-spacing: 2px; }
  .logo-text span { color: var(--accent2); }

  
  .hero-headline {
    font-family: 'Orbitron', monospace;
    font-size: 48px; font-weight: 800;
    line-height: 1.1; margin-bottom: 20px;
    background: linear-gradient(135deg, #fff 0%, var(--accent2) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    text-align: center;
  }
  .hero-sub {
    color: var(--muted); font-size: 16px; text-align: center;
    max-width: 420px; line-height: 1.7; margin-bottom: 48px;
  }

  
  .stats-row { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .stat-pill {
    background: rgba(59,130,246,0.1); border: 1px solid var(--border);
    border-radius: 50px; padding: 10px 20px;
    display: flex; align-items: center; gap: 8px;
    font-size: 14px; font-weight: 500;
  }
  .stat-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: blink 1.5s ease-in-out infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  
  .form-title {
    font-family: 'Orbitron', monospace; font-size: 20px;
    font-weight: 700; margin-bottom: 8px; text-align: center;
  }
  .form-subtitle { color: var(--muted); font-size: 13px; text-align: center; margin-bottom: 32px; }

  .tab-switch {
    display: flex; background: var(--surface); border-radius: 10px;
    padding: 4px; margin-bottom: 28px; width: 100%;
  }
  .tab-btn {
    flex: 1; padding: 9px; border: none; background: transparent;
    color: var(--muted); font-family: inherit; font-size: 13px;
    font-weight: 600; cursor: pointer; border-radius: 8px;
    transition: all 0.25s;
  }
  .tab-btn.active {
    background: var(--accent); color: white;
    box-shadow: 0 2px 12px rgba(59,130,246,0.4);
  }

  .form-group { margin-bottom: 18px; width: 100%; }
  .form-label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; letter-spacing: 0.5px; text-transform: uppercase; }
  .form-input {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 16px; color: var(--text);
    font-family: inherit; font-size: 14px; transition: all 0.25s;
    outline: none;
  }
  .form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
  .form-input::placeholder { color: var(--muted); }

  .input-row { display: flex; gap: 12px; }
  .input-row .form-group { flex: 1; }

  select.form-input option { background: var(--surface); }

  .btn-primary {
    width: 100%; padding: 14px; background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; border-radius: 10px; color: white; font-family: 'Orbitron', monospace;
    font-size: 13px; font-weight: 700; letter-spacing: 1px; cursor: pointer;
    transition: all 0.25s; margin-top: 8px;
    box-shadow: 0 4px 20px rgba(59,130,246,0.3);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 30px rgba(59,130,246,0.5); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .form-footer { text-align: center; margin-top: 20px; font-size: 13px; color: var(--muted); }
  .form-footer a { color: var(--accent2); text-decoration: none; font-weight: 600; }

  .error-msg {
    background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
    border-radius: 8px; padding: 10px 14px; font-size: 13px;
    color: #fca5a5; margin-bottom: 16px; display: none;
  }
  .success-msg {
    background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3);
    border-radius: 8px; padding: 10px 14px; font-size: 13px;
    color: #6ee7b7; margin-bottom: 16px; display: none;
  }

  
  .demo-box {
    background: rgba(6,182,212,0.07); border: 1px solid rgba(6,182,212,0.2);
    border-radius: 10px; padding: 12px 16px; margin-top: 20px; width: 100%;
  }
  .demo-label { font-size: 10px; font-weight: 700; letter-spacing: 1px; color: var(--accent2); text-transform: uppercase; margin-bottom: 6px; }
  .demo-cred { font-size: 12px; color: var(--muted); line-height: 1.6; cursor: pointer; }
  .demo-cred:hover { color: var(--text); }

  @media (max-width: 768px) {
    .left-panel { display: none; }
    .right-panel { width: 100%; padding: 40px 28px; border: none; }
  }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>


<div class="left-panel">
  <div class="logo">
    <div class="logo-icon">🚗</div>
    <div class="logo-text">CAMPUS<span>RIDE</span></div>
  </div>
  <h1 class="hero-headline">Smart Rides<br>For Campus Life</h1>
  <p class="hero-sub">
    
  </p>
  
</div>


<div class="right-panel">
  <div class="form-title">Welcome Back</div>
  <div class="form-subtitle">Sign in to access your rides</div>

  <div class="tab-switch">
    <button class="tab-btn active" onclick="switchTab('login')">Sign In</button>
    <button class="tab-btn" onclick="switchTab('register')">Register</button>
  </div>

  <div id="login-form" style="width:100%">
    <div class="error-msg" id="login-error"></div>
    <div class="form-group">
      <label class="form-label">Email Address</label>
      <input type="email" class="form-input" id="login-email" placeholder="you@campus.edu">
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" class="form-input" id="login-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn-primary" onclick="doLogin()" id="login-btn">SIGN IN →</button>
    <div class="demo-box">
      <div class="demo-label">🎓 Demo Accounts</div>
      <div class="demo-cred" onclick="fillDemo('arjun@campus.edu','pass123')">👨‍🎓 Student: arjun@campus.edu / pass123</div>
      <div class="demo-cred" onclick="fillDemo('ramesh@campus.edu','pass123')">👨‍🏫 Staff: ramesh@campus.edu / pass123</div>
    </div>
  </div>

  
  <div id="register-form" style="width:100%;display:none">
    <div class="error-msg" id="reg-error"></div>
    <div class="success-msg" id="reg-success"></div>
    <div class="input-row">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-input" id="reg-name" placeholder="Your Name">
      </div>
      <div class="form-group">
        <label class="form-label">Role</label>
        <select class="form-input" id="reg-role">
          <option value="student">Student</option>
          <option value="staff">Staff</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Email</label>
      <input type="email" class="form-input" id="reg-email" placeholder="you@campus.edu">
    </div>
    <div class="form-group">
      <label class="form-label">Phone</label>
      <input type="tel" class="form-input" id="reg-phone" placeholder="10-digit mobile number">
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" class="form-input" id="reg-password" placeholder="Min 6 characters">
    </div>
    <button class="btn-primary" onclick="doRegister()" id="reg-btn">CREATE ACCOUNT →</button>
  </div>
</div>

<script>
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('login-form').style.display = tab==='login'?'block':'none';
  document.getElementById('register-form').style.display = tab==='register'?'block':'none';
}
function fillDemo(email, pw) {
  document.getElementById('login-email').value = email;
  document.getElementById('login-password').value = pw;
}
async function doLogin() {
  const btn = document.getElementById('login-btn');
  const errEl = document.getElementById('login-error');
  btn.textContent = 'Signing in...'; btn.disabled = true;
  errEl.style.display = 'none';
  const res = await fetch('/login', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      email: document.getElementById('login-email').value,
      password: document.getElementById('login-password').value
    })
  }).then(r=>r.json());
  if (res.success) {
    btn.textContent = '✓ Welcome, ' + res.name;
    setTimeout(()=>window.location.href='/dashboard', 800);
  } else {
    errEl.textContent = res.message || 'Invalid credentials'; errEl.style.display='block';
    btn.textContent = 'SIGN IN →'; btn.disabled=false;
  }
}
async function doRegister() {
  const btn = document.getElementById('reg-btn');
  const errEl = document.getElementById('reg-error');
  btn.textContent = 'Creating...'; btn.disabled=true; errEl.style.display='none';
  const res = await fetch('/register', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      name: document.getElementById('reg-name').value,
      email: document.getElementById('reg-email').value,
      password: document.getElementById('reg-password').value,
      role: document.getElementById('reg-role').value,
      phone: document.getElementById('reg-phone').value
    })
  }).then(r=>r.json());
  if (res.success) {
    const successEl = document.getElementById('reg-success');
    successEl.textContent = '✓ Account created! Redirecting to sign in…';
    successEl.style.display = 'block';
    btn.textContent = '✓ Account Created';
    setTimeout(() => window.location.href = '/login', 1500);
  } else {
    errEl.textContent = res.message; errEl.style.display='block';
    btn.textContent = 'CREATE ACCOUNT →'; btn.disabled=false;
  }
}
</script>
</body>
</html>
